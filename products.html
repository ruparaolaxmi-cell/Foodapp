<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TasteWay — Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">TasteWay</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Menu</a>
        <a href="payment.html">Checkout</a>
      </nav>
      <button id="cartBtn" class="cart-btn">Cart (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <main class="container">
    <h1>Full Menu</h1>
    <p class="lead">Tap “Add” to add items to the cart. Open Checkout to review and place order.</p>

    <div class="filter-row">
      <input id="search" placeholder="Search dishes or tags (e.g., pizza, bowl, dessert)" />
    </div>

    <section id="menu" class="menu-grid">
      <!-- Cards will be injected by JS for easier reuse -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year2"></span> TasteWay</div>
  </footer>

  <script src="app.js"></script>
  <script>
    document.getElementById('year2').textContent = new Date().getFullYear();

    // sample product list (id, title, price, img, description, tags)
    const products = [
      {id:'p1',title:'Margherita Pizza', price:9.99, img:'https://source.unsplash.com/600x400/?pizza', desc:'Tomato, mozzarella, basil.', tags:['pizza','vegetarian']},
      {id:'p2',title:'Pepperoni Pizza', price:11.50, img:'https://source.unsplash.com/600x400/?pepperoni-pizza', desc:'Classic pepperoni and cheese.', tags:['pizza','meat']},
      {id:'p3',title:'Quinoa Bowl', price:11.50, img:'https://source.unsplash.com/600x400/?bowl,salad', desc:'Quinoa, roasted veggies, tahini.', tags:['bowl','vegan','healthy']},
      {id:'p4',title:'Grilled Chicken Wrap', price:8.50, img:'https://source.unsplash.com/600x400/?wrap,chicken', desc:'Grilled chicken and greens.', tags:['wrap','meat']},
      {id:'p5',title:'Chocolate Lava Cake', price:5.50, img:'https://source.unsplash.com/600x400/?chocolate-cake', desc:'Warm center, served with ice cream.', tags:['dessert']},
      {id:'p6',title:'Greek Salad', price:7.00, img:'https://source.unsplash.com/600x400/?salad,greek', desc:'Fresh cucumber, olives, feta.', tags:['salad','vegetarian']},
    ];

    const menu = document.getElementById('menu');

    function renderProducts(list) {
      menu.innerHTML = '';
      list.forEach(p=> {
        const card = document.createElement('article');
        card.className = 'menu-card';
        card.innerHTML = `
          <img src="${p.img}" alt="${p.title}">
          <div class="menu-card-body">
            <h3>${p.title}</h3>
            <p class="muted">${p.desc}</p>
            <div class="menu-meta">
              <strong>$${p.price.toFixed(2)}</strong>
              <div>
                <button class="btn-sm" data-add="${p.id}">Add</button>
              </div>
            </div>
          </div>
        `;
        menu.appendChild(card);
      });

      // attach add listeners
      document.querySelectorAll('[data-add]').forEach(btn=>{
        btn.addEventListener('click', e=>{
          const id = e.currentTarget.dataset.add;
          const prod = products.find(x=>x.id===id);
          addToCart(prod, 1);
        });
      });
    }

    // initial render
    renderProducts(products);

    // search filter
    document.getElementById('search').addEventListener('input', (e)=>{
      const q = e.target.value.trim().toLowerCase();
      const filtered = products.filter(p => p.title.toLowerCase().includes(q) || p.tags.join(' ').includes(q) || p.desc.toLowerCase().includes(q));
      renderProducts(filtered);
    });

    // cart button behaviour
    document.getElementById('cartBtn').addEventListener('click', ()=> location.href = 'payment.html');

    // show cart count immediately
    refreshCartCount();
  </script>
</body>
</html>

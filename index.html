<!doctype html>
<html lang="en">
<head>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TasteWay — Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">TasteWay</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Menu</a>
        <a href="payment.html">Checkout</a>
      </nav>
      <button id="cartBtn" class="cart-btn">Cart (<span class="cart-count">0</span>)</button>
    </div>
  </header>

  <main>
    <section class="hero container">
      <div class="hero-left">
        <h1>Fresh meals delivered fast — made with love.</h1>
        <p class="lead">Curated daily menu and comfort classics. Demo for class — fully working.</p>
        <div class="hero-actions">
          <a class="btn" href="products.html">View Menu</a>
          <a class="btn btn-ghost" href="payment.html">Checkout</a>
        </div>
      </div>
      <div class="hero-right">
        <img alt="Assorted dishes" src="https://source.unsplash.com/900x600/?food,meal" />
      </div>
    </section>

    <section class="container popular">
      <h2>Popular</h2>
      <div class="cards">
        <article class="card"><img src="https://source.unsplash.com/400x300/?pizza" alt=""><div class="card-body"><h4>Margherita Pizza</h4><p>$9.99</p><a class="btn-sm" href="products.html">Order</a></div></article>
        <article class="card"><img src="https://source.unsplash.com/400x300/?bowl" alt=""><div class="card-body"><h4>Quinoa Bowl</h4><p>$11.50</p><a class="btn-sm" href="products.html">Order</a></div></article>
        <article class="card"><img src="https://source.unsplash.com/400x300/?dessert" alt=""><div class="card-body"><h4>Chocolate Cake</h4><p>$5.50</p><a class="btn-sm" href="products.html">Order</a></div></article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> TasteWay — Demo</div>
  </footer>

  <script src="app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('cartBtn').addEventListener('click', ()=> location.href = 'payment.html');
  </script>
</body>
</html>
